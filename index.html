<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Planner</title>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-900 dark:bg-slate-900 dark:text-slate-100">
    <main class="mx-auto w-full max-w-xl px-4 py-8 sm:py-12">
      <header class="mb-6 flex items-center justify-between gap-3">
        <div>
          <h1 class="text-3xl font-bold tracking-tight">Study Planner</h1>
          <p class="text-sm text-slate-600 dark:text-slate-400">Plan it, do it, tick it off.</p>
        </div>
        <button id="theme-toggle" type="button" aria-label="Toggle dark mode"
          class="rounded-full bg-white p-2 text-xl shadow hover:bg-slate-50 dark:bg-slate-800 dark:hover:bg-slate-700">
          🌓
        </button>
      </header>

      <form id="task-form" class="rounded-xl bg-white p-4 shadow dark:bg-slate-800" novalidate>
        <label for="task-input" class="mb-1 block text-sm font-medium">New task</label>
        <div class="flex flex-col gap-2 sm:flex-row">
          <input id="task-input" type="text" autocomplete="off" placeholder="e.g. Revise chapter 4"
            aria-describedby="form-error"
            class="min-w-0 flex-1 rounded-lg border border-slate-300 bg-white px-3 py-2 dark:border-slate-600 dark:bg-slate-900" />
          <label for="priority-select" class="sr-only">Priority</label>
          <select id="priority-select"
            class="rounded-lg border border-slate-300 bg-white px-2 py-2 dark:border-slate-600 dark:bg-slate-900">
            <option value="high">High</option>
            <option value="medium" selected>Medium</option>
            <option value="low">Low</option>
          </select>
          <button type="submit"
            class="rounded-lg bg-indigo-600 px-4 py-2 font-semibold text-white hover:bg-indigo-700">
            Add
          </button>
        </div>
        <p id="form-error" role="alert" class="mt-2 min-h-5 text-sm font-medium text-red-600 dark:text-red-400"></p>
      </form>

      <section class="mt-4 rounded-xl bg-white p-4 shadow dark:bg-slate-800">
        <div class="mb-3 flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
          <div>
            <label for="search-input" class="sr-only">Search tasks</label>
            <input id="search-input" type="search" placeholder="Search tasks…"
              class="w-full rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-sm dark:border-slate-600 dark:bg-slate-900" />
          </div>
          <button id="sort-toggle" type="button" aria-pressed="false"
            class="rounded-lg border border-slate-300 px-3 py-1.5 text-sm dark:border-slate-600">
            Sort by priority
          </button>
        </div>

        <nav id="filters" aria-label="Task filters" class="mb-3 flex gap-2">
          <button type="button" data-filter="all" class="filter-btn rounded-full px-3 py-1 text-sm">All</button>
          <button type="button" data-filter="active" class="filter-btn rounded-full px-3 py-1 text-sm">Active</button>
          <button type="button" data-filter="completed" class="filter-btn rounded-full px-3 py-1 text-sm">Completed</button>
        </nav>

        <ul id="task-list" class="divide-y divide-slate-200 dark:divide-slate-700"></ul>
        <p id="empty-state" class="hidden py-8 text-center text-slate-500 dark:text-slate-400"></p>

        <footer class="mt-3 flex items-center justify-between border-t border-slate-200 pt-3 text-sm dark:border-slate-700">
          <span id="counter" aria-live="polite"></span>
          <button id="clear-completed" type="button"
            class="rounded-lg px-3 py-1 text-red-600 hover:bg-red-50 dark:text-red-400 dark:hover:bg-slate-700">
            Clear completed
          </button>
        </footer>
      </section>
    </main>

    <dialog id="confirm-dialog"
      class="m-auto w-[90%] max-w-sm rounded-xl bg-white p-5 text-slate-900 shadow-xl backdrop:bg-black/50 dark:bg-slate-800 dark:text-slate-100">
      <form method="dialog">
        <h2 class="text-lg font-semibold">Delete this task?</h2>
        <p id="confirm-text" class="my-3 break-words text-sm text-slate-600 dark:text-slate-300"></p>
        <div class="flex justify-end gap-2">
          <button value="cancel" class="rounded-lg border border-slate-300 px-3 py-1.5 dark:border-slate-600">Cancel</button>
          <button value="confirm" class="rounded-lg bg-red-600 px-3 py-1.5 font-semibold text-white hover:bg-red-700">Delete</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
